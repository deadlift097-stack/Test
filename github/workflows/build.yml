      - name: Install Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;${NDK_VERSION}"
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure (arm64-v8a)
        working-directory: project
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake"
          -DANDROID_ABI=arm64-v8a
          -DANDROID_PLATFORM=android-28
          -DANDROID_STL=c++_shared

      - name: Build and package
        working-directory: project
        run: cmake --build build --target levi_package

      - name: Show package contents
        working-directory: project
        run: |
          for f in build/*.levipack; do echo "$f"; unzip -l "$f"; done

      - uses: actions/upload-artifact@v4
        with:
          name: BetterHitreg-levipack
          path: project/build/*.levipack
          if-no-files-found: error
